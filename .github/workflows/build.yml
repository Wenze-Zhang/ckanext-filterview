name: Build CKAN Docker 

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs: 
  build:  
    runs-on: ubuntu-latest
    steps: 
    -  uses: actions/checkout@v2

    -  name: Set up Docker Buildx
       uses: docker/setup-buildx-action@v1
      
    -  name: Set up QEMU
       uses: docker/setup-qemu-action@v1

    -  name: NGINX build
       uses: docker/build-push-action@v2
       with:
          context: ./dev/nginx
          file: ./dev/nginx/Dockerfile
          push: false
          tags: kowhai/ckan-docker-nginx:test-build-only

    -  name: PostgreSQL build
       uses: docker/build-push-action@v2
       with:
          context: ./dev/postgresql
          file: ./dev/postgresql/Dockerfile
          push: false
          tags: kowhai/ckan-docker-postgresql:test-build-only

    -  name: CKAN build
       uses: docker/build-push-action@v2
       with:
          context: ./dev/ckan
          file: ./dev/ckan/Dockerfile
          push: false
          tags: kowhai/ckan-docker-ckan:test-build-only
      