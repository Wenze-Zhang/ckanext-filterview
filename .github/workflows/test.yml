name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build & metadata check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate package metadata
        run: twine check dist/*

  test:
    name: pytest (CKAN ${{ matrix.ckan-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ckan-version: ["2.11", "2.10"]

    container:
      image: ckan/ckan-dev:${{ matrix.ckan-version }}
      options: --user root

    services:
      solr:
        image: ckan/ckan-solr:${{ matrix.ckan-version }}-solr9
      postgres:
        image: ckan/ckan-postgres-dev:${{ matrix.ckan-version }}
        options: >-
          --health-cmd "pg_isready -U ckan_default"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:3

    env:
      CKAN_SQLALCHEMY_URL: postgresql://ckan_default:pass@postgres/ckan_test
      CKAN_DATASTORE_WRITE_URL: postgresql://datastore_write:pass@postgres/datastore_test
      CKAN_DATASTORE_READ_URL: postgresql://datastore_read:pass@postgres/datastore_test
      CKAN_SOLR_URL: http://solr:8983/solr/ckan
      CKAN_REDIS_URL: redis://redis:6379/1

    steps:
      - uses: actions/checkout@v4

      # Non-editable install: copies package into site-packages so the
      # 'ckanext' namespace path order isn't polluted by the workspace
      # checkout. CKAN datastore resolves ckanext/datastore/tests/
      # allowed_functions.txt via ckanext.__path__[0]; with `pip install -e`
      # that points at $GITHUB_WORKSPACE and the file isn't there.
      - name: Install extension
        run: pip install .

      - name: Generate test.ini
        run: cp /srv/app/src/ckan/test-core.ini "$GITHUB_WORKSPACE/test.ini"

      # Must run from the CKAN source dir: the datastore loads
      # ckanext/datastore/tests/allowed_functions.txt via a path relative
      # to CWD, so running pytest from the repo root would 404.
      - name: Run pytest
        working-directory: /srv/app/src/ckan
        run: pytest --ckan-ini="$GITHUB_WORKSPACE/test.ini" --disable-warnings "$GITHUB_WORKSPACE/ckanext/filterview/tests"
